name: One-time cleanup of merged professional menu branch

on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-branch-cleanup.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'manoj8927/RAM-MD' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm merged branch is unchanged before deleting
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='fix/professional-menu-command-reliability'
          expected='d635296ed5738cae208595631512fa5d3f991cde'
          actual="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha')"
          merged="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/2" --jq '.merged')"
          default="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"
          if [[ "$actual" != "$expected" || "$merged" != true || "$default" != main ]]; then
            echo '::error::Safety check failed; keeping branch.'
            exit 1
          fi
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null
          echo 'Deleted merged temporary branch. Main is preserved.'
