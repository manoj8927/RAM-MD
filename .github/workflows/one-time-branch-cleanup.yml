name: One-time cleanup of merged RAM-MD branch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-branch-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'manoj8927/RAM-MD' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm PR was merged and feature branch has not changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='feature/ram-downloader-api'
          expected='6951bd6a44ba69ea23bc99cb836f8549ce343f7f'
          actual="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha')"
          merged="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/1" --jq '.merged')"
          default="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"
          if [[ "$actual" != "$expected" || "$merged" != true || "$default" != main ]]; then
            echo '::error::Branch moved, PR unmerged, or default branch changed. No deletion performed.'
            exit 1
          fi
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null
          echo 'Removed safely: feature/ram-downloader-api'
