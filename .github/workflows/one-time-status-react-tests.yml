name: One-time RAM-MD Auto Status reaction tests
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-status-react-tests.yml'
permissions:
  contents: read
jobs:
  test-status-reactions:
    if: github.repository == 'manoj8927/RAM-MD'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Auto Status reaction and quick-button unit tests
        run: node --test tests/auto-status-react.test.js tests/status-buttons.test.js
